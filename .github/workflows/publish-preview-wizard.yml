name: Publish FlightLogX Preview wizard

on:
  push:
    branches:
      - preview

permissions:
  contents: write

concurrency:
  group: publish-preview-wizard
  cancel-in-progress: false

jobs:
  publish:
    name: Publish protected Preview wizard asset
    runs-on: windows-latest
    timeout-minutes: 25
    environment: preview

    steps:
      - name: Check out exact Preview commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate Preview source
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "preview") {
            throw "Preview wizard publication must run from the preview branch."
          }

          $version = (Get-Content -LiteralPath version.txt -Raw).Trim()
          if ($version -notmatch '^3\.\d+\.\d+$') {
            throw "Preview workbook version must be 3.x.x. Found: $version"
          }

      - name: Build Preview wizard asset
        shell: pwsh
        env:
          HOSTED_SUPABASE_URL: ${{ vars.ELECTRONIC_LOGBOOK_PREVIEW_SUPABASE_URL }}
          HOSTED_SUPABASE_ANON_KEY: ${{ secrets.ELECTRONIC_LOGBOOK_PREVIEW_SUPABASE_ANON_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HOSTED_SUPABASE_URL) -or
              [string]::IsNullOrWhiteSpace($env:HOSTED_SUPABASE_ANON_KEY)) {
            throw "Protected Preview hosted-sync configuration is missing."
          }

          $configPath = Join-Path $env:RUNNER_TEMP "wizard-hosted-sync.json"
          [pscustomobject][ordered]@{
            supabaseUrl = $env:HOSTED_SUPABASE_URL
            anonKey = $env:HOSTED_SUPABASE_ANON_KEY
            platformLabel = "Excel workbook"
          } | ConvertTo-Json | Set-Content -LiteralPath $configPath -Encoding UTF8

          ./updater/Publish-WizardAsset.ps1 -HostedSyncConfigPath $configPath

      - name: Publish Preview bridge release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath version.txt -Raw).Trim()
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $tag = "dev-wizard-$shortSha"
          $title = "FlightLogX Preview workbook updater $version ($shortSha)"
          Set-Content -Path dev-wizard-commit.txt -Value $env:GITHUB_SHA -Encoding ascii
          Set-Content -Path preview-wizard-channel.txt -Value "preview`n$env:GITHUB_SHA" -Encoding ascii
          Set-Content -Path pilot-wizard-channel.txt -Value "pilot`n$env:GITHUB_SHA" -Encoding ascii
          $notes = @"
          Publicly downloadable prerelease used only by the coached, invitation-only
          FlightLogX Preview channel. It is not offered to main-channel workbooks.

          Version: $version
          Commit: $env:GITHUB_SHA
          Branch: preview

          The dev-wizard tag name is retained because the 2.0.3 bootstrap requires it
          for the first controlled update to 3.x. The pilot channel marker is retained
          only for the matching 2.0.3 compatibility branch.
          "@

          $existing = gh release view $tag `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName,targetCommitish,assets `
            2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0) {
            if ($existing.targetCommitish -ne $env:GITHUB_SHA) {
              throw "Release $tag exists for a different commit."
            }

            # The dev and Preview branches can deliberately point at the same source commit.
            # The unprotected dev workflow may therefore create this compatibility tag first
            # with development hosted configuration. Replace every executable/config-bearing
            # asset with this protected environment's build before exposing the legacy ref.
            gh release upload $tag `
              updater/dist/ElectronicLogbook.Updater.Wizard.exe `
              updater/dist/ElectronicLogbook.Updater.Wizard.win-x64.zip `
              updater/dist/wizard-signature-report.json `
              dev-wizard-commit.txt `
              preview-wizard-channel.txt `
              pilot-wizard-channel.txt `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            Write-Host "Release $tag now contains the protected Preview wizard assets."
          } else {
            gh release create $tag `
              updater/dist/ElectronicLogbook.Updater.Wizard.exe `
              updater/dist/ElectronicLogbook.Updater.Wizard.win-x64.zip `
              updater/dist/wizard-signature-report.json `
              dev-wizard-commit.txt `
              preview-wizard-channel.txt `
              pilot-wizard-channel.txt `
              --repo $env:GITHUB_REPOSITORY `
              --title $title `
              --notes $notes `
              --prerelease `
              --target $env:GITHUB_SHA `
              --latest=false
          }

      - name: Align legacy pilot branch after protected publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api `
            --method PATCH `
            "repos/$env:GITHUB_REPOSITORY/git/refs/heads/pilot" `
            -f sha=$env:GITHUB_SHA `
            -F force=false | Out-Null
          $verifiedPilotSha = gh api `
            "repos/$env:GITHUB_REPOSITORY/git/ref/heads/pilot" `
            --jq '.object.sha'
          if ($verifiedPilotSha -ne $env:GITHUB_SHA) {
            throw "Legacy pilot branch did not advance to the protected Preview commit."
          }
