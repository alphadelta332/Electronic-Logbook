name: Publish FlightLogX Preview wizard

on:
  push:
    branches:
      - pilot

permissions:
  contents: write

concurrency:
  group: publish-preview-wizard
  cancel-in-progress: false

jobs:
  publish:
    name: Publish protected Preview wizard asset
    runs-on: windows-latest
    timeout-minutes: 25
    environment: pilot

    steps:
      # The branch and environment retain their legacy external names until the
      # owner-controlled GitHub migration is completed.
      - name: Check out exact Preview commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate Preview source
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "pilot") {
            throw "Preview wizard publication must run from the legacy pilot branch."
          }

          $version = (Get-Content -LiteralPath version.txt -Raw).Trim()
          if ($version -notmatch '^3\.\d+\.\d+$') {
            throw "Preview workbook version must be 3.x.x. Found: $version"
          }

      - name: Build Preview wizard asset
        shell: pwsh
        env:
          HOSTED_SUPABASE_URL: ${{ vars.ELECTRONIC_LOGBOOK_PILOT_SUPABASE_URL }}
          HOSTED_SUPABASE_ANON_KEY: ${{ secrets.ELECTRONIC_LOGBOOK_PILOT_SUPABASE_ANON_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HOSTED_SUPABASE_URL) -or
              [string]::IsNullOrWhiteSpace($env:HOSTED_SUPABASE_ANON_KEY)) {
            throw "Protected Preview hosted-sync configuration is missing."
          }

          $configPath = Join-Path $env:RUNNER_TEMP "wizard-hosted-sync.json"
          [pscustomobject][ordered]@{
            supabaseUrl = $env:HOSTED_SUPABASE_URL
            anonKey = $env:HOSTED_SUPABASE_ANON_KEY
            platformLabel = "Excel workbook"
          } | ConvertTo-Json | Set-Content -LiteralPath $configPath -Encoding UTF8

          ./updater/Publish-WizardAsset.ps1 -HostedSyncConfigPath $configPath

      - name: Publish Preview bridge release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath version.txt -Raw).Trim()
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $tag = "dev-wizard-$shortSha"
          $title = "FlightLogX Preview workbook updater $version ($shortSha)"
          Set-Content -Path dev-wizard-commit.txt -Value $env:GITHUB_SHA -Encoding ascii
          Set-Content -Path pilot-wizard-channel.txt -Value "pilot`n$env:GITHUB_SHA" -Encoding ascii
          $notes = @"
          Publicly downloadable prerelease used only by the coached, invitation-only
          FlightLogX Preview channel. It is not offered to main-channel workbooks.

          Version: $version
          Commit: $env:GITHUB_SHA
          Branch: pilot (legacy external name; canonical channel is preview)

          The dev-wizard tag name is retained because the 2.0.3 bootstrap requires it
          for the first controlled update to 3.x.
          "@

          $existing = gh release view $tag `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName,targetCommitish,assets `
            2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0) {
            if ($existing.targetCommitish -ne $env:GITHUB_SHA) {
              throw "Release $tag exists for a different commit."
            }

            if ($existing.assets.name -notcontains "pilot-wizard-channel.txt") {
              gh release upload $tag `
                pilot-wizard-channel.txt `
                --repo $env:GITHUB_REPOSITORY
            }
            Write-Host "Release $tag already contains immutable wizard assets."
          } else {
            gh release create $tag `
              updater/dist/ElectronicLogbook.Updater.Wizard.exe `
              updater/dist/ElectronicLogbook.Updater.Wizard.win-x64.zip `
              updater/dist/wizard-signature-report.json `
              dev-wizard-commit.txt `
              pilot-wizard-channel.txt `
              --repo $env:GITHUB_REPOSITORY `
              --title $title `
              --notes $notes `
              --prerelease `
              --target $env:GITHUB_SHA `
              --latest=false
          }
