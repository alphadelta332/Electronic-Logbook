name: Publish mobile PWA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "updater/src/ElectronicLogbook.Portable/**"
      - ".github/workflows/publish-mobile-pwa.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mobile-pwa-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish static PWA
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Publish Blazor WebAssembly app
        shell: pwsh
        run: |
          dotnet publish mobile/src/ElectronicLogbook.Mobile/ElectronicLogbook.Mobile.csproj `
            --configuration Release `
            --output mobile/artifacts/pages

          $siteRoot = Join-Path $PWD "mobile/artifacts/pages/wwwroot"
          $indexPath = Join-Path $siteRoot "index.html"
          $basePath = "/$($env:GITHUB_REPOSITORY.Split('/')[1])/"
          $index = Get-Content -LiteralPath $indexPath -Raw
          if (-not $index.Contains('<base href="/" />')) {
            throw "index.html did not contain the expected root base href."
          }
          $index = $index.Replace('<base href="/" />', "<base href=""$basePath"" />")
          [System.IO.File]::WriteAllText($indexPath, $index, [System.Text.UTF8Encoding]::new($false))
          $serviceWorkerPath = Join-Path $siteRoot "service-worker.js"
          $serviceWorker = Get-Content -LiteralPath $serviceWorkerPath -Raw
          if (-not $serviceWorker.Contains('const base = "/";')) {
            throw "service-worker.js did not contain the expected root cache base."
          }
          $serviceWorker = $serviceWorker.Replace('const base = "/";', "const base = ""$basePath"";")
          [System.IO.File]::WriteAllText($serviceWorkerPath, $serviceWorker, [System.Text.UTF8Encoding]::new($false))
          New-Item -ItemType File -Path (Join-Path $siteRoot ".nojekyll") -Force | Out-Null

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: mobile/artifacts/pages/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
