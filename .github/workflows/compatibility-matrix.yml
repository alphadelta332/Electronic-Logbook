name: Compatibility matrix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  excel-compatibility-matrix:
    name: Excel compatibility matrix
    runs-on: [self-hosted, windows, excel]
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run compatibility matrix
        shell: pwsh
        run: ./updater/Test-CompatibilityMatrix.ps1
