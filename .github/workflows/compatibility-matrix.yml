name: Compatibility matrix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  excel-compatibility-matrix:
    name: Excel compatibility matrix
    runs-on: [self-hosted, windows, excel]
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run compatibility matrix
        shell: pwsh
        run: ./updater/Test-CompatibilityMatrix.ps1
