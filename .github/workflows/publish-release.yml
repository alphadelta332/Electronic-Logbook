name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub release assets
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release metadata
        shell: pwsh
        run: |
          ./tools/Test-ReleaseMetadata.ps1
          ./tools/Test-VbaSourceQuality.ps1
          $version = (Get-Content version.txt -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version.txt ($version). Expected v$version."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $env:GITHUB_REF_NAME does not point to a commit on main."
          }

      - name: Build release integrity files
        shell: pwsh
        run: |
          ./updater/Publish-WizardAsset.ps1

          $version = (Get-Content version.txt -Raw).Trim()
          $readme = Get-Content README.md -Raw
          $releaseNotesPattern = "(?ms)^### \[$([regex]::Escape($version))\].*?(?=^### \[|\z)"
          $releaseNotesMatch = [regex]::Match($readme, $releaseNotesPattern)
          if (-not $releaseNotesMatch.Success) {
            throw "README.md changelog does not contain release notes for $version."
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "release-notes.md"),
            $releaseNotesMatch.Value.Trim(),
            [System.Text.UTF8Encoding]::new($false))

          $assets = @(
            Get-Item Electronic_Logbook_Master.xlsm
            Get-Item README.pdf
            Get-Item updater/dist/ElectronicLogbook.Updater.Wizard.exe
            Get-Item updater/dist/ElectronicLogbook.Updater.Wizard.win-x64.zip
          )

          $manifestAssets = foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)" | Add-Content SHA256SUMS.txt -Encoding ascii
            [ordered]@{
              name = $asset.Name
              size = $asset.Length
              sha256 = $hash
            }
          }

          [ordered]@{
            version = $version
            tag = $env:GITHUB_REF_NAME
            commit = $env:GITHUB_SHA
            assets = @($manifestAssets)
          } | ConvertTo-Json -Depth 4 | Set-Content release-manifest.json -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArgs = @(
            "release"
            "create"
            $env:GITHUB_REF_NAME
            "Electronic_Logbook_Master.xlsm"
            "README.pdf"
            "updater/dist/ElectronicLogbook.Updater.Wizard.exe"
            "updater/dist/ElectronicLogbook.Updater.Wizard.win-x64.zip"
            "SHA256SUMS.txt"
            "release-manifest.json"
            "--title"
            $env:GITHUB_REF_NAME
            "--notes-file"
            "release-notes.md"
            "--verify-tag"
          )

          gh @releaseArgs
