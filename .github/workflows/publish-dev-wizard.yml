name: Publish dev wizard

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dev-wizard
  cancel-in-progress: true

jobs:
  publish:
    name: Publish rolling dev wizard asset
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Build wizard asset
        shell: pwsh
        run: ./updater/Publish-WizardAsset.ps1

      - name: Publish dev wizard release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "dev-wizard"
          $title = "Development updater wizard"
          Set-Content -Path dev-wizard-commit.txt -Value $env:GITHUB_SHA -Encoding ascii
          $notes = @"
          Rolling development wizard asset for dev-channel workbook update testing.

          Commit: $env:GITHUB_SHA
          Branch: $env:GITHUB_REF_NAME
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title $title `
              --notes $notes `
              --prerelease `
              --target $env:GITHUB_SHA `
              --latest=false
          } else {
            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title $title `
              --notes $notes `
              --prerelease `
              --latest=false
          }

          gh release upload $tag `
            updater/dist/ElectronicLogbook.Updater.Wizard.exe `
            updater/dist/ElectronicLogbook.Updater.Wizard.win-x64.zip `
            dev-wizard-commit.txt `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
