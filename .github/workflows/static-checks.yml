name: Static checks

on:
  pull_request:
  push:
    branches:
      - dev
      - hotfix
      - main

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-metadata:
    name: Release metadata
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release metadata
        shell: pwsh
        run: ./tools/Test-ReleaseMetadata.ps1

  vba-source-quality:
    name: VBA source quality
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate VBA source
        shell: pwsh
        run: ./tools/Test-VbaSourceQuality.ps1

  external-updater:
    name: External updater
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Generate mobile PWA icons
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File mobile/scripts/Generate-AppIcons.ps1

      - name: Build solution
        run: dotnet build ElectronicLogbook.Updater.sln --configuration Release

      - name: Test solution
        shell: pwsh
        run: dotnet test ElectronicLogbook.Updater.sln --configuration Release --no-build
