name = "flightlogx-preview-activity"
main = "worker.mjs"
compatibility_date = "2026-10-05"
workers_dev = false
preview_urls = false

# Deployment supplies the project URL/publishable key and a remote publisher-only secret.
# Enable this schedule only after the development and Preview migration checks.
[triggers]
crons = ["17 */4 * * *", "7 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
