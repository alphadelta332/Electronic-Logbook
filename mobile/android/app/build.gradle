apply plugin: 'com.android.application'

def versionManifest = [:]
rootProject.file('../../versions.properties').eachLine('UTF-8') { rawLine ->
    def line = rawLine.trim()
    if (line && !line.startsWith('#')) {
        def separator = line.indexOf('=')
        if (separator < 1 || separator == line.length() - 1) {
            throw new GradleException("versions.properties contains an invalid line: '${line}'. Expected key=value.")
        }
        def key = line.substring(0, separator)
        def value = line.substring(separator + 1).trim()
        if (versionManifest.containsKey(key)) {
            throw new GradleException("versions.properties contains duplicate key '${key}'.")
        }
        versionManifest[key] = value
    }
}
def requiredVersionKeys = ['sheet_version', 'app_version', 'android_version_code']
def unknownVersionKeys = versionManifest.keySet() - requiredVersionKeys
if (!unknownVersionKeys.isEmpty()) {
    throw new GradleException("versions.properties contains unknown key '${unknownVersionKeys.first()}'.")
}
requiredVersionKeys.each { key ->
    if (!versionManifest.containsKey(key)) {
        throw new GradleException("versions.properties is missing required key '${key}'.")
    }
}
def appVersion = versionManifest.app_version
def sheetVersion = versionManifest.sheet_version
if (!(sheetVersion ==~ /^\d+\.\d+\.\d+$/)) {
    throw new GradleException("versions.properties key 'sheet_version' must contain a numeric major.minor.patch version.")
}
if (!(appVersion ==~ /^\d+\.\d+\.\d+$/)) {
    throw new GradleException("versions.properties key 'app_version' must contain a numeric major.minor.patch version.")
}
def androidVersionCodeText = versionManifest.android_version_code
if (!(androidVersionCodeText ==~ /^\d+$/)) {
    throw new GradleException("versions.properties key 'android_version_code' must be a positive integer.")
}
def androidVersionCodeValue = new BigInteger(androidVersionCodeText)
if (androidVersionCodeValue < 1 || androidVersionCodeValue > 2100000000) {
    throw new GradleException("versions.properties key 'android_version_code' must be between 1 and 2100000000.")
}
def androidVersionCode = androidVersionCodeValue.toInteger()
def developmentKeystorePath = System.getenv('ELECTRONIC_LOGBOOK_DEV_KEYSTORE')
def previewSigningEnvironment = [
    keystore: System.getenv('ELECTRONIC_LOGBOOK_PREVIEW_KEYSTORE') ?: System.getenv('ELECTRONIC_LOGBOOK_PILOT_KEYSTORE'),
    storePassword: System.getenv('ELECTRONIC_LOGBOOK_PREVIEW_STORE_PASSWORD') ?: System.getenv('ELECTRONIC_LOGBOOK_PILOT_STORE_PASSWORD'),
    keyAlias: System.getenv('ELECTRONIC_LOGBOOK_PREVIEW_KEY_ALIAS') ?: System.getenv('ELECTRONIC_LOGBOOK_PILOT_KEY_ALIAS'),
    keyPassword: System.getenv('ELECTRONIC_LOGBOOK_PREVIEW_KEY_PASSWORD') ?: System.getenv('ELECTRONIC_LOGBOOK_PILOT_KEY_PASSWORD')
]
def configuredPreviewSigningValues = previewSigningEnvironment.values().count { it }
if (configuredPreviewSigningValues > 0 && configuredPreviewSigningValues < previewSigningEnvironment.size()) {
    throw new GradleException("The FlightLogX Preview signing environment is incomplete.")
}
def previewSigningConfigured = configuredPreviewSigningValues == previewSigningEnvironment.size()

android {
    namespace = "com.alphadelta.electroniclogbook"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId = "com.alphadelta.electroniclogbook"
        minSdkVersion = rootProject.ext.minSdkVersion
        targetSdkVersion = rootProject.ext.targetSdkVersion
        versionCode = androidVersionCode
        versionName = appVersion
        buildConfigField "boolean", "PREVIEW_UPDATES_ENABLED", "false"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (developmentKeystorePath) {
            electronicLogbookDevelopment {
                storeFile file(developmentKeystorePath)
                storePassword System.getenv('ELECTRONIC_LOGBOOK_DEV_STORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('ELECTRONIC_LOGBOOK_DEV_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('ELECTRONIC_LOGBOOK_DEV_KEY_PASSWORD') ?: 'android'
            }
        }
        if (previewSigningConfigured) {
            flightLogXPreview {
                storeFile file(previewSigningEnvironment.keystore)
                storePassword previewSigningEnvironment.storePassword
                keyAlias previewSigningEnvironment.keyAlias
                keyPassword previewSigningEnvironment.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            if (developmentKeystorePath) {
                signingConfig signingConfigs.electronicLogbookDevelopment
            }
        }
        acceptance {
            initWith debug
            applicationIdSuffix ".acceptance"
            matchingFallbacks = ['debug']
            if (developmentKeystorePath) {
                signingConfig signingConfigs.electronicLogbookDevelopment
            }
        }
        preview {
            initWith release
            buildConfigField "boolean", "PREVIEW_UPDATES_ENABLED", "true"
            matchingFallbacks = ['release']
            if (previewSigningConfigured) {
                signingConfig signingConfigs.flightLogXPreview
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def previewArtifactTasks = ['assemblePreview', 'bundlePreview', 'packagePreview']
    def previewArtifactRequested = graph.allTasks.any { previewArtifactTasks.contains(it.name) }
    if (previewArtifactRequested && !previewSigningConfigured) {
        throw new GradleException(
            "Preview artifacts must use the permanent FlightLogX signing identity. Run npm.cmd run build:android:preview.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.credentials:credentials:$androidxCredentialsVersion"
    implementation "androidx.credentials:credentials-play-services-auth:$androidxCredentialsVersion"
    implementation "com.google.android.libraries.identity.googleid:googleid:$googleIdVersion"
    implementation "com.google.firebase:firebase-appdistribution-api:16.0.0-beta20"
    previewImplementation "com.google.firebase:firebase-appdistribution:16.0.0-beta20"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// The private Firebase descriptor is registered to the permanent package used by the
// Preview variant. Applying it to debug or acceptance makes Google Services reject their
// deliberately suffixed application IDs before those builds can compile.
def googleServicesRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(java.util.Locale.ROOT).contains('preview')
}
if (googleServicesRequested) {
    def servicesJSON = file('google-services.json')
    if (!servicesJSON.isFile() || !servicesJSON.text.trim()) {
        throw new GradleException(
            "Preview builds require mobile/android/app/google-services.json for the permanent package.")
    }

    apply plugin: 'com.google.gms.google-services'
}
