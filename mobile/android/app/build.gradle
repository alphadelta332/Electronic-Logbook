apply plugin: 'com.android.application'

def productVersion = rootProject.file('../../version.txt').text.trim()
def productVersionMatch = productVersion =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!productVersionMatch.matches()) {
    throw new GradleException("version.txt must contain a numeric major.minor.patch version.")
}

def productVersionParts = [
    major: productVersionMatch[0][1].toInteger(),
    minor: productVersionMatch[0][2].toInteger(),
    patch: productVersionMatch[0][3].toInteger()
]
if (productVersionParts.major > 20 || productVersionParts.minor > 99 || productVersionParts.patch > 99) {
    throw new GradleException("Android versions require major <= 20, minor <= 99, and patch <= 99.")
}
// Reserve four low-order digits for signed Preview build revisions. Android versionCode
// is monotonic and intentionally independent from the user-visible versionName.
def productVersionCode =
    productVersionParts.major * 100000000 +
    productVersionParts.minor * 1000000 +
    productVersionParts.patch * 10000
def previewBuildRevisionText = providers.gradleProperty('flightLogXPreviewBuildRevision').orNull
def legacyPilotBuildRevisionText = providers.gradleProperty('flightLogXPilotBuildRevision').orNull
if (previewBuildRevisionText != null && legacyPilotBuildRevisionText != null &&
        previewBuildRevisionText != legacyPilotBuildRevisionText) {
    throw new GradleException("Preview and legacy pilot build revisions must match when both are supplied.")
}
previewBuildRevisionText = previewBuildRevisionText ?: legacyPilotBuildRevisionText
def previewBuildRevision = 0
if (previewBuildRevisionText != null) {
    if (!(previewBuildRevisionText ==~ /^\d+$/)) {
        throw new GradleException("flightLogXPreviewBuildRevision must be a whole number from 1 to 9999.")
    }
    previewBuildRevision = previewBuildRevisionText.toInteger()
    if (previewBuildRevision < 1 || previewBuildRevision > 9999) {
        throw new GradleException("flightLogXPreviewBuildRevision must be a whole number from 1 to 9999.")
    }
}
def androidVersionCode = productVersionCode + previewBuildRevision
def developmentKeystorePath = System.getenv('ELECTRONIC_LOGBOOK_DEV_KEYSTORE')
def previewSigningEnvironment = [
    keystore: System.getenv('ELECTRONIC_LOGBOOK_PREVIEW_KEYSTORE') ?: System.getenv('ELECTRONIC_LOGBOOK_PILOT_KEYSTORE'),
    storePassword: System.getenv('ELECTRONIC_LOGBOOK_PREVIEW_STORE_PASSWORD') ?: System.getenv('ELECTRONIC_LOGBOOK_PILOT_STORE_PASSWORD'),
    keyAlias: System.getenv('ELECTRONIC_LOGBOOK_PREVIEW_KEY_ALIAS') ?: System.getenv('ELECTRONIC_LOGBOOK_PILOT_KEY_ALIAS'),
    keyPassword: System.getenv('ELECTRONIC_LOGBOOK_PREVIEW_KEY_PASSWORD') ?: System.getenv('ELECTRONIC_LOGBOOK_PILOT_KEY_PASSWORD')
]
def configuredPreviewSigningValues = previewSigningEnvironment.values().count { it }
if (configuredPreviewSigningValues > 0 && configuredPreviewSigningValues < previewSigningEnvironment.size()) {
    throw new GradleException("The FlightLogX Preview signing environment is incomplete.")
}
def previewSigningConfigured = configuredPreviewSigningValues == previewSigningEnvironment.size()

android {
    namespace = "com.alphadelta.electroniclogbook"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId = "com.alphadelta.electroniclogbook"
        minSdkVersion = rootProject.ext.minSdkVersion
        targetSdkVersion = rootProject.ext.targetSdkVersion
        versionCode = androidVersionCode
        versionName = productVersion
        buildConfigField "boolean", "PREVIEW_UPDATES_ENABLED", "false"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (developmentKeystorePath) {
            electronicLogbookDevelopment {
                storeFile file(developmentKeystorePath)
                storePassword System.getenv('ELECTRONIC_LOGBOOK_DEV_STORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('ELECTRONIC_LOGBOOK_DEV_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('ELECTRONIC_LOGBOOK_DEV_KEY_PASSWORD') ?: 'android'
            }
        }
        if (previewSigningConfigured) {
            flightLogXPreview {
                storeFile file(previewSigningEnvironment.keystore)
                storePassword previewSigningEnvironment.storePassword
                keyAlias previewSigningEnvironment.keyAlias
                keyPassword previewSigningEnvironment.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            if (developmentKeystorePath) {
                signingConfig signingConfigs.electronicLogbookDevelopment
            }
        }
        acceptance {
            initWith debug
            applicationIdSuffix ".acceptance"
            matchingFallbacks = ['debug']
            if (developmentKeystorePath) {
                signingConfig signingConfigs.electronicLogbookDevelopment
            }
        }
        preview {
            initWith release
            buildConfigField "boolean", "PREVIEW_UPDATES_ENABLED", "true"
            matchingFallbacks = ['release']
            if (previewSigningConfigured) {
                signingConfig signingConfigs.flightLogXPreview
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def previewArtifactTasks = ['assemblePreview', 'bundlePreview', 'packagePreview']
    def previewArtifactRequested = graph.allTasks.any { previewArtifactTasks.contains(it.name) }
    if (previewBuildRevision > 0 && !previewArtifactRequested) {
        throw new GradleException(
            "flightLogXPreviewBuildRevision may only be used for a signed Preview artifact task.")
    }
    if (previewArtifactRequested && !previewSigningConfigured) {
        throw new GradleException(
            "Preview artifacts must use the permanent FlightLogX signing identity. Run npm.cmd run build:android:preview.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.credentials:credentials:$androidxCredentialsVersion"
    implementation "androidx.credentials:credentials-play-services-auth:$androidxCredentialsVersion"
    implementation "com.google.android.libraries.identity.googleid:googleid:$googleIdVersion"
    implementation "com.google.firebase:firebase-appdistribution-api:16.0.0-beta20"
    previewImplementation "com.google.firebase:firebase-appdistribution:16.0.0-beta20"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
