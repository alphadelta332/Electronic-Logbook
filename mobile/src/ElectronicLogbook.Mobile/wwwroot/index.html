<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlightLogX</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="ElectronicLogbook.Mobile.styles.css" rel="stylesheet" /> -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script>
        if (location.protocol === "https:" && location.hostname === "localhost") {
            document.documentElement.classList.add("capacitor-native");
        }
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui" role="alert" aria-live="assertive">
        Something went wrong. Your saved logbook data remains on this device.
        <a href="" class="reload">Restart app</a>
        <button type="button" class="dismiss">Dismiss</button>
    </div>
    <script src="js/logbookStore.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        const isEphemeralTunnel =
            location.hostname.endsWith(".trycloudflare.com") ||
            location.hostname.endsWith(".loca.lt");
        const isCapacitorNative = document.documentElement.classList.contains("capacitor-native");
        if ('serviceWorker' in navigator && !isEphemeralTunnel && !isCapacitorNative) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>

</html>
